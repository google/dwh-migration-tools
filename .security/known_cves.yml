# ===================================================================================================
# False positives of Dependency-Check's CPE matching: the CPE names the wrong product, implementation,
# module or version. These are not open findings. Each rule drops only the advisories it lists, and only
# on the artifacts it lists: group:name (any version, when the reason does not depend on the version),
# group:name:version (that version only), or a file name for the Dumper's own jars, which have no Maven
# coordinates. The daily scan reports how many findings each rule dropped, and fails on the findings of
# an expired rule. Rules have no CVE key, so the PR scan, which reads only the CVE key, ignores them.
# ===================================================================================================

- false_positive: "app.jar: Google Cloud Application Integration advisory"
  artifacts:
    - app.jar
  advisories:
    - CVE-2025-0982
  justification: >
    app.jar holds the Dumper's own classes and has no Maven coordinates. Dependency-Check derives the
    google:application_integration CPE from the words google and application in its package names
    (com.google.edwmigration.dumper.application). CVE-2025-0982 is in the JavaScript Task feature of the
    Google Cloud Application Integration service, which the Dumper does not contain.
  expiration_date: 2027-05-31

