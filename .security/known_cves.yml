- CVE: CVE-2026-89044
  artifact: io.grpc:grpc-netty-shaded:1.85.0
  justification: >
    Not a false positive. grpc-netty-shaded 1.85.0 bundles netty 4.2.17.Final, including its HTTP codec,
    and this advisory affects netty 4.2.13.Final to 4.2.17.Final; it is fixed in 4.2.18.Final. No grpc
    release bundles the fix yet (1.85.1 also has 4.2.17.Final). Neither scanner reports it on this jar
    (Dependency-Check reads the jar as netty 1.85.0, and the OSV record has no Maven package), so this
    entry is kept by hand. The Dumper uses the bundled netty only as a gRPC client, through the Google
    Cloud client libraries. Tracked in b/579421681.
  expiration_date: 2026-12-31
- CVE: CVE-2026-59171
  artifact: org.json:json:20240303
  justification: >
    Not a false positive. databricks-jdbc 3.4.5 bundles org.json 20240303 (relocated to
    com.databricks.internal.json); fixed in 20260719. The standalone json jar is fixed (20260814,
    PR #1221); the bundled copy needs a databricks-jdbc upgrade. Tracked in b/579421681.
  expiration_date: 2026-12-31
- CVE: CVE-2026-41848
  artifact: org.springframework:spring-core:5.3.39
  justification: >
    Not a false positive: Spring Framework advisory that the GitHub advisory database maps to spring-
    core 5.3.39. No open-source 5.3.x release has the fix; 6.2.x needs Java 17, and the Java 8
    alternative is removing Spring. Tracked in b/579421681.
  expiration_date: 2027-01-31
- CVE: CVE-2026-59282
  artifact: org.springframework:spring-core:5.3.39
  justification: >
    Not a false positive: data binding of untrusted property paths (spring-beans), affecting 5.3.0 to
    5.3.49; the Dumper does not bind untrusted property paths. No open-source 5.3.x release has the fix;
    6.2.x needs Java 17, and the Java 8 alternative is removing Spring. Tracked in b/579421681.
  expiration_date: 2027-01-31

# ===================================================================================================
# False positives of Dependency-Check's CPE matching: the CPE names the wrong product, implementation,
# module or version. These are not open findings. Each rule drops only the advisories it lists, and only
# on the artifacts it lists: group:name (any version, when the reason does not depend on the version),
# group:name:version (that version only), or a file name for the Dumper's own jars, which have no Maven
# coordinates. The daily scan reports how many findings each rule dropped, and fails on the findings of
# an expired rule. Rules have no CVE key, so the PR scan, which reads only the CVE key, ignores them.
# ===================================================================================================

- false_positive: "app.jar: Google Cloud Application Integration advisory"
  artifacts:
    - app.jar
  advisories:
    - CVE-2025-0982
  justification: >
    app.jar holds the Dumper's own classes and has no Maven coordinates. Dependency-Check derives the
    google:application_integration CPE from the words google and application in its package names
    (com.google.edwmigration.dumper.application). CVE-2025-0982 is in the JavaScript Task feature of the
    Google Cloud Application Integration service, which the Dumper does not contain.
  expiration_date: 2027-05-31

