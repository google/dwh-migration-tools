- CVE: CVE-2026-45292
  artifact: io.opentelemetry:opentelemetry-api:1.52.0
  justification: >
    Not a false positive. Fixed in opentelemetry-api 1.67.0, but opentelemetry-api, -sdk and -api-incubator
    resolve to mismatched versions through google-cloud-bigquery and grpc, so the fix needs an
    opentelemetry-bom alignment rather than a single pin. Accepted temporarily to unblock PR #1195;
    tracked in b/579421681.
  expiration_date: 2027-01-31

