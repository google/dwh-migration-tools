    - io.netty:netty-tcnative-boringssl-static
    - io.netty:netty-tcnative-classes
    - io.netty:netty-transport
    - io.netty:netty-transport-classes-epoll
    - io.netty:netty-transport-native-epoll
    - io.netty:netty-transport-native-unix-common
  advisories:
    - CVE-2026-89044
  justification: >
    CVE-2026-89044 (Transfer-Encoding validation, netty 4.1.133 to 4.1.137) is in the HTTP codec.
    Dependency-Check reports it on whichever standalone netty jar it groups the netty CPE under. The
    Dumper does not ship netty-codec-http as a jar. Copies of the codec that other jars bundle are not
    covered by this rule: the 4.2.17 one inside grpc-netty-shaded 1.85.0 is in the advisory's second
    range (4.2.13 to 4.2.17) and is listed as an open finding above.
  expiration_date: 2027-05-31
