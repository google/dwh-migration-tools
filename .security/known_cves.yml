# yaml-language-server: $schema=./known_cves_schema.json

- CVE: CVE-2025-41249
  artifact: org.springframework:spring-core:5.3.39
  justification: >
    The CVE is in Spring Security's @EnableMethodSecurity feature,
    this annotation or any other spring-security is not used in the Dumper tools.
    There is no dependency on Spring Security in the Dumper tools.

- CVE: CVE-2025-41242
  artifact: org.springframework:spring-core:5.3.39
  justification: >
    Spring Framework MVC applications can be vulnerable to a “Path Traversal Vulnerability” when deployed on a 
    non-compliant Servlet container. An application can be vulnerable when all the following are true: 
    * the application is deployed as a WAR or with an embedded Servlet container * ... and so on.
    The Dumper tools distributes as Jar only, Spring MVC is not used in the code.
    There is no dependency on Spring MVC in the Dumper tools.

- CVE: CVE-2024-6763
  artifact: org.eclipse.jetty:jetty-http:9.4.58.v20250814
  justification: >
    The Dumper is a CLI app, not a public-facing web server. It does not accept or process arbitrary URIs from untrusted
    external users. The attack vector for CVE-2024-6763 requires an attacker to supply 
    a malformed URI to be parsed by the server; The Dumper does not expose an interface for such input.
    
- CVE: CVE-2025-0982
  artifact: cpe:2.3:a:google:application_integration:8.2.1
  justification: >
    False positive; this artifact is incorrectly identified by the OWASP scanner. 
    It is not a direct or transitive dependency of dwh-migration-tools:dumper.
- CVE: CVE-2026-1225
  artifact: ch.qos.logback:logback-core:1.3.16
  justification: >
    Not a false positive. Fixed only in logback 1.5.x, which requires Java 11; the Dumper still targets
    Java 8. Accepted temporarily to unblock the version-only remediation in PR #1195. Remediation
    (Java 11+ baseline) is tracked in b/579421681.
  expiration_date: 2027-01-31

