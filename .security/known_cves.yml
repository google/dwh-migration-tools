- false_positive: "Standalone netty jars: request smuggling advisory in netty-codec-http"
  artifacts:
    - io.netty:netty-bom
    - io.netty:netty-buffer
    - io.netty:netty-codec
    - io.netty:netty-common
    - io.netty:netty-handler
